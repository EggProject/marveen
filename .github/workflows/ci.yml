name: ci

# Every PR gets the full gate. Pushes are gated on the two long-lived branches
# (feature-develop is the repo default, develop is the release target named in
# CONTRIBUTING.md) - topic branches are covered by their PR run instead.
on:
  pull_request:
  push:
    branches: [feature-develop, develop]

# A new push to the same ref cancels the previous run. Saves runner minutes on
# force-push-heavy PR branches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Only the coverage job widens this, and only to
# post its PR comment.
permissions:
  contents: read

# Every action is pinned to a full-length commit SHA with the tag in a trailing
# comment. Per GitHub's secure-use reference, a SHA is the only immutable way to
# reference an action - tags can be moved by a compromised upstream.
# Verified against the GitHub API on 2026-08-13.

jobs:
  # Static analysis. Runs typecheck first because it is the cheapest signal,
  # then the web asset syntax check, then ESLint last (it is the slowest and
  # currently the loudest).
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No bun-version input: setup-bun reads packageManager (bun@1.3.14) from
      # package.json, so the pin lives in one place.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # ESLint runs under Node, not Bun: node_modules/.bin/eslint has a
      # `#!/usr/bin/env node` shebang and `bun run` honours it without --bun.
      # Pinning Node here also makes NODE_OPTIONS=--max-old-space-size in the
      # lint script effective (it is a V8 flag, a no-op under Bun's JSC).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # setup-bun caches only the bun executable, not the package cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # `bun run syntax-check` is deliberately NOT wired in: `bun --check` is
      # not a real Bun flag, so the script executes web/app.js in a server
      # runtime and always dies on `window is not defined`. It is a broken gate,
      # not a passing one. See
      # docs/needs-to-be-fix/syntax-check-executes-web-bundle.md.

      - name: ESLint
        run: bun run lint

  # Unit tests without coverage instrumentation. Separate from the coverage job
  # so a threshold failure never masks an actual test failure.
  # tests/smoke/** is excluded by vitest.config.ts, so no Playwright browsers
  # are needed here.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # Coverage measurement. The 100% perFile threshold gate lives in
  # vitest.config.ts, so this job fails on any regression - and the report is
  # still published (if: always()) so you can see what dropped.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write # coverage PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run coverage

      # Fork PRs get a read-only GITHUB_TOKEN, so the comment is skipped there.
      # pull_request_target is deliberately not used - it would run with repo
      # secrets against untrusted code (the "pwn request" pattern).
      - name: Comment coverage on PR
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
